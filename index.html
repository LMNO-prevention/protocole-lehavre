<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Protocole Le Havre">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Protocole de sécurité – Le Havre</title>
<style>
:root{
  --green:#62bb46; --green-dk:#4a9a31; --lm:#78be20;
  --red:#c5222a; --navy:#1c2d5a; --teal:#0b627f; --gray:#b5b5b5;
  --ink:#1d1d1b; --muted:#6b6b6b; --line:#d9d9d9; --bg:#fff; --card:#fff;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.top img.logo{height:46px;width:auto}
.top .ttl{font-weight:700;font-size:18px;line-height:1.15;color:var(--ink);flex:1}
.top .ttl small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.langbtn{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:999px;
  padding:6px 14px 6px 8px;font-size:16px;font-weight:600;min-height:48px;cursor:pointer}
.langbtn img{width:36px;height:24px;border-radius:3px;border:1px solid #0002;object-fit:cover}

/* ---------- steps ---------- */
.tabs{display:flex;flex:0 0 auto}
.tab{flex:1;text-align:center;padding:14px 8px;font-weight:700;font-size:17px;background:var(--gray);color:#fff;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);margin-left:-10px}
.tab:first-child{margin-left:0;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
.tab.on{background:var(--teal)}
.tab.done{background:#5b8f9f}

/* ---------- body ---------- */
.body{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 20px;-webkit-overflow-scrolling:touch}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:12px 20px;background:#fff;border-top:1px solid var(--line)}
.bar .msg{flex:1;font-size:17px;font-weight:600;line-height:1.3;color:#444}
button.btn{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:12px;min-height:60px;padding:0 34px;cursor:pointer;
  background:var(--teal);color:#fff;touch-action:manipulation}
button.btn:active{filter:brightness(.9)}
button.btn.ghost{background:#fff;color:var(--teal);border:2px solid var(--teal)}
button.btn.go{background:var(--green-dk)}
button.btn[disabled]{opacity:.5}

/* ---------- home ---------- */
.home{max-width:1100px;margin:0 auto;text-align:center;padding-top:6px}
.home h1{font-size:30px;margin:14px 0 4px;line-height:1.15}
.home h2{font-size:20px;margin:0 0 22px;color:var(--muted);font-weight:600}
.green-title{display:inline-block;background:var(--green);color:#fff;border-radius:16px;padding:14px 30px;margin-bottom:10px}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.lbtn{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border:2px solid var(--line);
  border-radius:var(--r);font-size:21px;font-weight:700;min-height:82px;cursor:pointer;text-align:left;font-family:inherit;color:inherit;touch-action:manipulation}
.lbtn:active{border-color:var(--green-dk);background:#f0f9ec}
.lbtn img{width:62px;height:42px;border-radius:5px;border:1px solid #0002;object-fit:cover;flex:0 0 auto}

/* ---------- rules ---------- */
.sheet-title{background:var(--green);color:#fff;border-radius:14px;text-align:center;padding:9px 18px;margin:0 auto 4px;max-width:900px}
.sheet-title b{font-size:23px;line-height:1.15;font-weight:600}
.sheet-title b+b:before{content:' ';white-space:pre}
.sheet-sub{text-align:center;font-size:13.5px;font-weight:600;margin:4px auto 10px;max-width:900px;color:#333}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;max-width:1180px;margin:0 auto}
@media (max-width:820px){.rules{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:8px}
.rule{display:flex;align-items:stretch;gap:10px}
.icons{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:4px;width:60px;align-items:center}
.icons img{width:50px;height:50px;object-fit:contain}
.icons.two img{width:46px;height:46px}
.rtxt{flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--green);color:#fff;border-radius:6px;
  padding:8px 16px;font-size:19.5px;font-weight:500;line-height:1.22;min-height:60px}
.rtxt.red{background:var(--red)}
.rtxt .l2{margin-top:6px;padding-top:6px;border-top:1px solid #fff8}

/* ---------- plan ---------- */
.planwrap{position:relative;height:100%;min-height:300px;background:#fff;border:2px solid var(--line);border-radius:var(--r);overflow:hidden}
.pv{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden}
.pv img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none;-webkit-user-drag:none}
.zc{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:10px;z-index:3}
.zc button{width:62px;height:62px;border-radius:14px;border:2px solid #0003;background:#fff;font-size:34px;font-weight:700;line-height:1;color:var(--teal);box-shadow:0 2px 8px #0003;cursor:pointer;touch-action:manipulation}
.zc button.sm{font-size:20px}
.zhint{position:absolute;left:14px;bottom:12px;background:#000a;color:#fff;border-radius:999px;padding:8px 16px;font-size:15px;z-index:3;pointer-events:none}
.planmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted);text-align:center;padding:20px}

/* ---------- form ---------- */
.form{max-width:980px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.form .fld{grid-column:1/-1}
.form .fld.half{grid-column:auto}
@media (max-width:760px){.form{grid-template-columns:1fr}.form .fld.half{grid-column:1/-1}}
.fld label.l{display:block;font-weight:700;font-size:18px;color:#555;margin:0 0 6px}
.fld label.l i{color:var(--red);font-style:normal}
.fld input[type=text],.fld input[type=email],.fld input[type=tel],.fld textarea{
  width:100%;font:inherit;font-size:22px;padding:14px 16px;min-height:60px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
.fld textarea{min-height:64px;resize:none}
.fld input:focus,.fld textarea:focus{border-color:var(--teal)}
.fld.err input,.fld.err textarea,.fld.err .sigbox,.fld.err .chk{border-color:var(--red)}
.help{font-size:15px;color:var(--muted);margin-top:5px}
.errtxt{display:none;color:var(--red);font-weight:700;font-size:16px;margin-top:6px}
.fld.err .errtxt{display:block}
.chk{display:flex;align-items:center;gap:16px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:18px;font-weight:600;cursor:pointer;line-height:1.3}
.chk input{width:34px;height:34px;flex:0 0 auto;accent-color:var(--teal)}
.sigbox{position:relative;border:2px solid var(--line);border-radius:12px;background:#fff;height:190px;overflow:hidden}
.sigbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.sigbox .ph{position:absolute;left:16px;bottom:10px;right:130px;font-size:16px;color:#aaa;pointer-events:none;border-top:2px dashed #ccc;padding-top:6px}
.sigbox button{position:absolute;right:10px;top:10px;z-index:2;font:inherit;font-weight:700;font-size:16px;padding:10px 16px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer}
.certify{font-size:16px;font-weight:600;color:#444;margin-top:4px}

/* ---------- done / overlay ---------- */
.fin{max-width:760px;margin:6vh auto 0;text-align:center}
.fin .tick{width:130px;height:130px;border-radius:50%;background:var(--green);margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.fin .tick svg{width:78px;height:78px}
.fin h1{font-size:34px;margin:0 0 10px}
.fin p{font-size:22px;margin:6px 0;color:#444}
.fin .q{background:#fff6dc;border:2px solid #f0c24b;border-radius:12px;padding:12px 16px;font-size:18px;margin-top:18px}
.fin .cd{margin-top:26px;color:var(--muted);font-size:18px}
.ovl{position:fixed;inset:0;background:#fffe;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;font-size:24px;font-weight:700}
.spin{width:64px;height:64px;border-radius:50%;border:7px solid #ddd;border-top-color:var(--green-dk);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#qb{position:fixed;left:10px;bottom:76px;z-index:40;background:#fff6dc;border:2px solid #f0c24b;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;max-width:60vw;cursor:pointer}
/* ---------- chauffeurs déjà venus ---------- */
.known{max-width:820px;margin:0 auto;padding-top:6px}
.known h1{font-size:30px;margin:8px 0 6px}
.known .ks{font-size:19px;color:#444;margin:0 0 18px;line-height:1.35}
.kinp{width:100%;font:inherit;font-size:24px;padding:16px 18px;min-height:64px;border:2px solid var(--line);border-radius:12px;outline:none;-webkit-user-select:text;user-select:text}
.kinp:focus{border-color:var(--teal)}
.klab{font-weight:700;color:#555;font-size:17px;margin:16px 0 8px}
.klist{display:flex;flex-direction:column;gap:10px}
.kitem{font:inherit;font-size:22px;text-align:left;padding:16px 18px;min-height:64px;border:2px solid var(--line);border-radius:12px;background:#fff;color:inherit;cursor:pointer;touch-action:manipulation}
.kitem:active{border-color:var(--green-dk);background:#f0f9ec}
.kno{font-size:19px;color:var(--muted);padding:10px 4px}
.kchip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#eef6f9;border-radius:12px;font-size:21px}
button.btn.sm{min-height:48px;font-size:17px;padding:0 18px}
.kcard{border:2px solid var(--green-dk);border-radius:14px;padding:22px;background:#f6fbf3}
.kcard .kn{font-size:32px;font-weight:800}
.kcard .kc{font-size:22px;margin:4px 0 10px;color:#333}
.kcard .kv{font-size:18px;color:#2d6a1c;font-weight:700;margin-bottom:12px}
.kcard .kcert{font-size:18px;margin-bottom:18px;line-height:1.35}
.kbtns{display:flex;gap:14px;flex-wrap:wrap}
</style>

</head>

  if (STATIC) {

    return fetch(window.PROTOCOLE_API, { method: 'POST', redirect: 'follow', signal: ctl ? ctl.signal : undefined,

    if (!window.google || !google.script || !google.script.run) { reject(new Error('no-server')); return; }

    var r = google.script.run
      .withSuccessHandler(function (v) { if (!done) { done = true; clearTimeout(t); resolve(v); } })
      .withFailureHandler(function (e) { if (!done) { done = true; clearTimeout(t); reject(e || new Error('fail')); } });
    r[fn].apply(r, args);
  });
}

  function strBytes(s) { var u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255; return u; }

  var n = pages.length, objN = 3 + n * 3 + 1;   // 1 catalog, 2 pages, (page,img,content)×n, info
  put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  function begin(id) { offs[id] = len; put(id + ' 0 obj\n'); }
  begin(1); put('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  var kids = []; for (var i = 0; i < n; i++) kids.push((3 + i * 3) + ' 0 R');
  begin(2); put('<< /Type /Pages /Count ' + n + ' /Kids [' + kids.join(' ') + '] >>\nendobj\n');
  pages.forEach(function (pg, i) {
    var pid = 3 + i * 3, iid = pid + 1, cid = pid + 2, content = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    begin(pid); put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ' + iid + ' 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ' + cid + ' 0 R >>\nendobj\n');
    begin(iid); put('<< /Type /XObject /Subtype /Image /Width ' + pg.w + ' /Height ' + pg.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + pg.bytes.length + ' >>\nstream\n');
    put(pg.bytes); put('\nendstream\nendobj\n');
    begin(cid); put('<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream\nendobj\n');
  });
  var info = objN - 1;
  begin(info); put('<< /Title ' + hex16(title) + ' /Author ' + hex16(author) + ' /Producer (Borne protocole securite) >>\nendobj\n');
  var xref = len; put('xref\n0 ' + objN + '\n0000000000 65535 f \n');
  for (var k = 1; k < objN; k++) put(('0000000000' + offs[k]).slice(-10) + ' 00000 n \n');
  put('trailer\n<< /Size ' + objN + ' /Root 1 0 R /Info ' + info + ' 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  var out = new Uint8Array(len), p = 0;
  chunks.forEach(function (u) { out.set(u, p); p += u.length; });
  return out;
}
function buildPdf(lang, when) {
  var l = I[lang], need = {
    logo: A.logo, flag: flag(l.flag), plan: S.plan || null, sig: S.sig || null
  };
  ['vest', 'boots', 'pedestrian', 'unloading', 'keys', 'waiting', 'nostay', 'phone', 'nosmoke', 'speed', 'rescue', 'firstaid', 'gathering'].forEach(function (n) { need[n] = A[n]; });
  var keys = Object.keys(need), imgs = {};
  return Promise.all(keys.map(function (k) { return need[k] ? loadImg(need[k]) : Promise.resolve(null); })).then(function (arr) {
    keys.forEach(function (k, i) { imgs[k] = arr[i]; });
    // the SVG flag has no intrinsic size in some browsers: force a raster size
    var cv1 = page1(lang, imgs), cv2 = page2(lang, when, imgs);
    var pages = [cv1, cv2].map(function (cv) {
      var d = cv.toDataURL('image/jpeg', 0.9);
      return { bytes: b64ToBytes(d.substring(d.indexOf(',') + 1)), w: cv.width, h: cv.height };
    });
    var title = 'Protocole de sécurité chargement/déchargement – ' + S.f.company.trim() + ' – ' + S.f.last.trim();
    return bytesToB64(makePdf(pages, title, CFG.storeName));
  });
}

/* ---------------------------------------------------------------- installation : clé d'accès (version PWA) */
function renderSetup(msg) {
  $app.innerHTML = topbar(false) + '<div class="body"><div class="known"><h1>Configuration de la borne</h1>' +
    '<p class="ks">Saisissez la clé d’accès (une seule fois sur cette tablette).<br>Enter the access key (once on this tablet).</p>' +
    '<input id="kk" class="kinp" type="password" autocomplete="off" autocapitalize="none" placeholder="Clé / Key">' +
    '<div class="kno" id="kmsg" style="color:#c5222a;font-weight:700">' + esc(msg || '') + '</div></div></div>' +
    '<div class="bar"><div class="msg"></div><button class="btn go" data-act="ksave">Valider</button></div>';
}
function saveKey() {
  var v = (document.getElementById('kk') || {}).value || ''; v = v.trim(); if (!v) return;
  var prev = KEY; KEY = v; NEEDKEY = false;
  callServer('getConfig', [v], 30000).then(function (c) {
    try { localStorage.setItem('lh_key', v); } catch (e) {}
    if (c) { for (var k in c) if (c[k] !== undefined && c[k] !== null) CFG[k] = c[k]; }
    NEEDKEY = false; render(); loadKnown(); loadPlanOnce(); flushQueue();
  }).catch(function (e) {
    KEY = prev; NEEDKEY = true;
    renderSetup(/ERR_KEY/.test(String(e && e.message)) ? 'Clé incorrecte / Wrong key' : 'Serveur injoignable : vérifiez le wifi / Server unreachable');
  });
}

/* ---------------------------------------------------------------- 5. chauffeurs déjà venus */
var KK = 'lh_known_v1';
function normS(t) {
  return String(t == null ? '' : t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/ł/g, 'l')
    .replace(/[^a-z0-9Ѐ-ӿ]+/g, ' ').trim();
}
function knownAvail() { return CFG.knownEnabled !== false && S.known && S.known.length > 0; }
function loadKnown() {
  if (CFG.knownEnabled === false || NEEDKEY) return Promise.resolve();
  return callServer('getKnown', [KEY], 40000).then(function (l) {
    if (l && l.length !== undefined) { S.known = l; try { localStorage.setItem(KK, JSON.stringify(l)); } catch (e) {} }
  }).catch(function () {});
}
function companyMatches(q) {
  var nq = normS(q); if (nq.length < 2 || !S.known) return [];
  var map = {};
  S.known.forEach(function (k) { var key = normS(k.c); if (key.indexOf(nq) >= 0 && !map[key]) map[key] = { key: key, name: k.c }; });
  return Object.keys(map).map(function (k) { return map[k]; })
    .sort(function (a, b) { return a.name.localeCompare(b.name); }).slice(0, 12);
}
function drivers(key) {
  return (S.known || []).filter(function (k) { return normS(k.c) === key; })
    .sort(function (a, b) { return (a.n + a.p).localeCompare(b.n + b.p); });
}
function companyListHTML() {
  var t = ui(), q = normS(S.kq); if (q.length < 2) return '';
  var m = companyMatches(S.kq);
  if (!m.length) return '<div class="kno">' + esc(t.kNone) + '</div>';
  return m.map(function (c) { return '<button class="kitem" data-act="kco" data-k="' + esc(c.key) + '" data-n="' + esc(c.name) + '">' + esc(c.name) + '</button>'; }).join('');
}
function renderKnown() {
  var t = ui(), body = '<h1>' + esc(t.kTitle) + '</h1><p class="ks">' + esc(t.kSub) + '</p>';
  if (S.ksel) {
    var k = S.ksel;
    body += '<div class="kcard"><div class="kn">' + esc(k.n.toUpperCase()) + ' ' + esc(k.p) + '</div><div class="kc">' + esc(k.c) + '</div>' +
      '<div class="kv">' + esc(t.kValid.replace('{d}', k.d).replace('{u}', k.u)) + '</div>' +
      '<div class="kcert">' + esc(t.kCert) + '</div>' +
      '<div class="kbtns"><button class="btn go" data-act="kok">' + esc(t.kConfirm) + '</button>' +
      '<button class="btn ghost" data-act="knot">' + esc(t.kNotMe) + '</button></div></div>';
  } else if (S.kco) {
    body += '<div class="kchip"><b>' + esc(S.kcoName) + '</b><button class="btn ghost sm" data-act="kchg">' + esc(t.kChange) + '</button></div>' +
      '<div class="klab">' + esc(t.kPickName) + '</div><div class="klist">' +
      drivers(S.kco).map(function (d, i) { return '<button class="kitem" data-act="kdrv" data-i="' + i + '"><b>' + esc(d.n.toUpperCase()) + '</b> ' + esc(d.p) + '</button>'; }).join('') + '</div>';
  } else {
    body += '<input id="kq" class="kinp" type="text" autocomplete="off" autocapitalize="words" placeholder="' + esc(t.kCompany) + '" value="' + esc(S.kq) + '">' +
      '<div class="klab">' + esc(t.kPickCo) + '</div><div class="klist" id="kres">' + companyListHTML() + '</div>';
  }
  $app.innerHTML = topbar(true) + '<div class="body"><div class="known">' + body + '</div></div>' +
    '<div class="bar"><div class="msg"></div><button class="btn go" data-act="kfirst">' + esc(t.kFirst) + '</button></div>';
}
function confirmVisit() {
  if (S.sending || !S.ksel) return;
  S.sending = true; overlay(true);
  var k = S.ksel, lang = S.lang || 'fr';
  var payload = { type: 'visit', key: KEY, uid: uid(), lang: lang, langName: I[lang].name, last: k.n, first: k.p, company: k.c, when: fmtDate(new Date()) };
  callServer('recordVisit', [payload], 60000).then(function (r) {
    return r && r.ok ? { ok: true } : { ok: false, err: r && r.error };
  }).catch(function () {
    return qAdd(payload).then(function (ok) { if (ok) { updBadge(); return { ok: true, queued: true }; } return { ok: false }; });
  }).then(function (res) {
    S.sending = false; overlay(false);
    if (res.ok) { S.queued = !!res.queued; S.step = 4; render(); }
    else if (res.err === 'ERR_UNKNOWN') { alert(ui().kExpired); S.ksel = null; loadKnown(); S.step = 1; render(); }
    else alert('Erreur d’enregistrement, merci de prévenir le magasin.\nSaving error, please notify the store.' + (res.err ? '\n(' + res.err + ')' : ''));
  });
}

/* ---------------------------------------------------------------- submit + offline queue */
var QK = 'lh_protocol_queue_v1', flushing = false, QDB = null;
/* File d'attente : IndexedDB (plusieurs centaines de Mo) ; localStorage en secours / ancienne version */
function lsGet() { try { return JSON.parse(localStorage.getItem(QK) || '[]'); } catch (e) { return []; } }
function lsSet(a) { try { localStorage.setItem(QK, JSON.stringify(a)); return true; } catch (e) { return false; } }
function qOpen() {
  if (QDB) return QDB;
  QDB = new Promise(function (res, rej) {
    try {
      var r = indexedDB.open('lh_protocols', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('q', { keyPath: 'uid' }); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    } catch (e) { rej(e); }
  });
  return QDB;
}
function qTx(mode, fn) {
  return qOpen().then(function (db) {
    return new Promise(function (res, rej) {
      var tx = db.transaction('q', mode), out = fn(tx.objectStore('q'));
      tx.oncomplete = function () { res(out && out.result); };
      tx.onerror = tx.onabort = function () { rej(tx.error); };
    });
  });
}
function qAll() {
  return qTx('readonly', function (s) { return s.getAll(); })
    .then(function (a) { return (a || []).concat(lsGet()); })
    .catch(function () { return lsGet(); });
}
function qAdd(p) {
  return qTx('readwrite', function (s) { return s.put(p); }).then(function () { return true; })
    .catch(function () { var q = lsGet(); q.push(p); return lsSet(q); });
}
function qDel(uid) {
  return qTx('readwrite', function (s) { return s.delete(uid); }).catch(function () {})
    .then(function () { lsSet(lsGet().filter(function (p) { return p.uid !== uid; })); });
}
/* Copie de secours : le PDF est aussi téléchargé sur la tablette quand l'envoi échoue */
function backupPdf(p) {
  try {
    var bin = atob(p.pdf), n = bin.length, u8 = new Uint8Array(n);
    for (var i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([u8], { type: 'application/pdf' }));
    var a = document.createElement('a'); a.href = url;
    a.download = 'protocole_en_attente_' + String(p.when || '').replace(/[^0-9]/g, '') + '_' + p.uid.slice(-4) + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 20000);
  } catch (e) {}
}
function updBadge() {
  qAll().then(function (q) {
    var el = document.getElementById('qb');
    if (!q.length) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'qb'; el.setAttribute('data-act', 'qretry'); document.body.appendChild(el); }
    el.textContent = '⏳ ' + q.length + ' protocole(s) en attente d’envoi – toucher pour réessayer / pending – tap to retry';
  });
}
function flushQueue() {
  if (flushing || NEEDKEY) return; flushing = true;
  qAll().then(function (q) {
    var i = 0;
    (function next() {
      if (i >= q.length) { flushing = false; updBadge(); return; }
      var p = q[i++]; if (STATIC && KEY) p.key = KEY;
      callServer(p.type === 'visit' ? 'recordVisit' : 'saveProtocol', [p], 120000).then(function (r) {
        if (r && (r.ok || (p.type === 'visit' && r.error === 'ERR_UNKNOWN'))) return qDel(p.uid);
      }).then(next, function () { flushing = false; updBadge(); });
    })();
  }).catch(function () { flushing = false; });
}
function overlay(on) {
  var ov = document.getElementById('ovl');
  if (on && !ov) { var d = document.createElement('div'); d.id = 'ovl'; d.className = 'ovl'; d.innerHTML = '<div class="spin"></div><div>' + esc(ui().sending) + '</div>'; document.body.appendChild(d); }
  if (!on && ov) ov.remove();
}
function submit() {
  if (S.sending) return;
  if (!validate()) return;
  S.sending = true; overlay(true);
  var when = new Date(), lang = S.lang || 'fr', f = S.f;
  buildPdf(lang, when).then(function (b64) {
    var payload = {
      key: KEY, uid: uid(), lang: lang, langName: I[lang].name,
      last: f.last.trim(), first: f.first.trim(), company: f.company.trim(),
      phone: f.phone.trim(), email: f.email.trim(), noMail: !!f.noMail && !f.email.trim(),
      extra: f.extra.trim(), when: fmtDate(when), pdf: b64
    };
    return callServer('saveProtocol', [payload], 120000).then(function (r) {
      if (r && r.ok) return { ok: true };
      return { ok: false, permanent: true, msg: r && r.error };
    }).catch(function () {
      return qAdd(payload).then(function (ok) {
        if (!ok) return { ok: false, permanent: false };
        backupPdf(payload); updBadge();
        return { ok: true, queued: true };
      });
    });
  }).then(function (res) {
    S.sending = false; overlay(false);
    if (res.ok) { S.queued = !!res.queued; S.step = 4; render(); loadKnown(); }
    else alert('Erreur d’enregistrement, merci de prévenir le magasin.\nSaving error, please notify the store.' + (res.msg ? '\n(' + res.msg + ')' : ''));
  }).catch(function (e) {
    S.sending = false; overlay(false);
    alert('Erreur technique, merci de prévenir le magasin.\nTechnical error, please notify the store.\n(' + (e && e.message || e) + ')');
  });
}

/* ---------------------------------------------------------------- events */
document.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('[data-act]') : null; if (!b) return;
  var a = b.getAttribute('data-act');
  if (a === 'pick') {
    S.lang = b.getAttribute('data-lang');
    if (!S.resume) { S.kq = ''; S.kco = ''; S.kcoName = ''; S.ksel = null; }
    S.step = S.resume || (knownAvail() ? 5 : 1); S.resume = 0; render();
  }
  else if (a === 'kco') { S.kco = b.getAttribute('data-k'); S.kcoName = b.getAttribute('data-n'); render(); }
  else if (a === 'kdrv') { S.ksel = drivers(S.kco)[+b.getAttribute('data-i')] || null; render(); }
  else if (a === 'kok') confirmVisit();
  else if (a === 'ksave') saveKey();
  else if (a === 'knot') { S.ksel = null; render(); }
  else if (a === 'kchg') { S.kco = ''; S.kcoName = ''; S.kq = ''; S.ksel = null; render(); }
  else if (a === 'kfirst') { S.ksel = null; S.step = 1; render(); }
  else if (a === 'lang') { S.resume = S.step; S.step = 0; render(); }
  else if (a === 'next1') { S.step = 2; render(); if (!S.plan && !S.planErr) loadPlanOnce(); }
  else if (a === 'back2') { S.step = 1; render(); }
  else if (a === 'next2') { S.step = 3; render(); }
  else if (a === 'back3') { S.step = 2; render(); }
  else if (a === 'submit') submit();
  else if (a === 'sigclear') { if (window.__sigClear) window.__sigClear(); }
  else if (a === 'zin' && S.viewer) S.viewer.zin();
  else if (a === 'zout' && S.viewer) S.viewer.zout();
  else if (a === 'zreset' && S.viewer) S.viewer.reset();
  else if (a === 'qretry') flushQueue();
  else if (a === 'planretry') { S.planErr = false; render(); loadPlan(); }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'kq') { S.kq = e.target.value; var r = document.getElementById('kres'); if (r) r.innerHTML = companyListHTML(); return; }
  var t = e.target, id = t.id; if (!id || !(id in S.f)) return;
  if (id === 'noMail') return;
  S.f[id] = t.value;
  if (S.errs[id]) { delete S.errs[id]; var b = document.getElementById('f_' + id), m = document.getElementById('e_' + id); if (b) b.classList.remove('err'); if (m) m.textContent = ''; }
  if (id === 'email' && t.value && S.f.noMail) { S.f.noMail = false; var c = document.getElementById('noMail'); if (c) c.checked = false; }
  if (id === 'email') { delete S.errs.noMail; var nb = document.getElementById('f_noMail'); if (nb) nb.classList.remove('err'); var nm = document.getElementById('e_noMail'); if (nm) nm.textContent = ''; }
});
document.addEventListener('change', function (e) {
  if (e.target.id !== 'noMail') return;
  S.f.noMail = e.target.checked;
  if (S.f.noMail) {
    S.f.email = ''; var em = document.getElementById('email'); if (em) em.value = '';
    ['email', 'noMail'].forEach(function (k) { delete S.errs[k]; var b = document.getElementById('f_' + k), m = document.getElementById('e_' + k); if (b) b.classList.remove('err'); if (m) m.textContent = ''; });
  }
});
['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, function () { lastAct = Date.now(); }, true); });
setInterval(function () {
  if (((S.step >= 1 && S.step < 4) || S.step === 5) && !S.sending && Date.now() - lastAct > CFG.idleSeconds * 1000) resetAll();
}, 5000);
// no pull-to-zoom / accidental gestures on the kiosk
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('contextmenu', function (e) { if (!/INPUT|TEXTAREA/.test(e.target.tagName)) e.preventDefault(); });

var planLoading = false;
function loadPlanOnce() { if (planLoading || S.plan) return; planLoading = true; loadPlan().then(function () { planLoading = false; }); }

/* ---------------------------------------------------------------- boot */
render();
(NEEDKEY ? Promise.resolve() : callServer('getConfig', [KEY], 20000)).then(function (c) {
  if (c) { for (var k in c) if (c[k] !== undefined && c[k] !== null) CFG[k] = c[k]; }
}).catch(function () {});
try { var kc = JSON.parse(localStorage.getItem(KK) || 'null'); if (kc && kc.length) S.known = kc; } catch (e) {}
loadKnown(); setInterval(loadKnown, 30 * 60000); window.addEventListener('online', loadKnown);
loadPlanOnce();
window.__qAll = qAll;
flushQueue(); updBadge(); setInterval(flushQueue, 60000); window.addEventListener('online', flushQueue);
window.__kiosk = { S: S, render: render, buildPdf: buildPdf, CFG: CFG };
})();
</script>

if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
